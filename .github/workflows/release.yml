name: Release Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.12.0'
        required: true
        type: string

permissions:
  contents: write

# MUST match sync-upstream.yml — only one of sync/release can run at a time
concurrency:
  group: deepseek-release-lock
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Resolve release source (tag, or main if tag tree incomplete)
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"
          echo "Release tag: ${TAG}"

          git fetch --tags origin
          git fetch origin main

          tree_complete() {
            # Check working tree files after checkout
            test -f .github/workflows/ci.yml \
              && test -f .github/workflows/release.yml \
              && test -f package.json \
              && test -f packages/shell-host/package.json
          }

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} not found"
            exit 1
          fi

          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          echo "TAG_SHA=${TAG_SHA}"

          # Prefer the tag commit
          git checkout --force "${TAG_SHA}"

          if tree_complete; then
            HEAD_SHA="$(git rev-parse HEAD)"
            echo "Using complete tag tree at ${HEAD_SHA}"
            exit 0
          fi

          echo "WARNING: tag ${TAG} points to incomplete tree (missing custom workflows)"
          echo "Falling back to origin/main if version matches"

          git checkout --force origin/main
          MAIN_VERSION="$(node -p "require('./package.json').version")"
          echo "main package.json version=${MAIN_VERSION}"

          if [ "${MAIN_VERSION}" != "${VERSION}" ]; then
            echo "ERROR: main version (${MAIN_VERSION}) != tag version (${VERSION})"
            echo "Fix the tag first (re-run Sync Upstream) or release the matching version."
            exit 1
          fi

          if ! tree_complete; then
            echo "ERROR: origin/main is also missing required files"
            ls -la .github/workflows/ || true
            exit 1
          fi

          echo "Using origin/main at $(git rev-parse HEAD) (version ${MAIN_VERSION})"

      - name: Validate release tree is complete
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release.yml
          test -f package.json
          test -f packages/shell-host/package.json
          echo "Workflows present:"
          ls -la .github/workflows/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run release quality gates
        run: npm run ci:quality

      - name: Publish Shell Host npm package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"

          ROOT_VERSION="$(node -p "require('./package.json').version")"
          SHELL_VERSION="$(node -p "require('./packages/shell-host/package.json').version")"

          if [ "${ROOT_VERSION}" != "${VERSION}" ]; then
            echo "Root version mismatch: package.json=${ROOT_VERSION} tag=${VERSION}"
            exit 1
          fi

          if [ "${SHELL_VERSION}" != "${VERSION}" ]; then
            echo "Shell version mismatch: shell-host=${SHELL_VERSION} tag=${VERSION}"
            exit 1
          fi

          if npm view "deepseek-pp-shell-host@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: deepseek-pp-shell-host@${VERSION}"
            exit 0
          fi

          # automation-contract-smoke requires this exact phrase:
          # NPM_TOKEN secret is required
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required because deepseek-pp-shell-host@${VERSION} is not published."
            exit 1
          fi

          npm publish --workspace packages/shell-host --access public

      - name: Locate packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find dist -maxdepth 1 -type f -name '*.zip' | sort)

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "No packages found in dist/"
            exit 1
          fi

          {
            echo "zip_files<<EOF"
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_FILES: ${{ steps.package.outputs.zip_files }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"
          TITLE="DeepSeek++ ${VERSION}"
          NOTES_FILE="docs/releases/${VERSION}.md"

          mapfile -t RELEASE_FILES <<< "${ZIP_FILES}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release exists, uploading assets"
            gh release upload "${TAG}" "${RELEASE_FILES[@]}" --clobber
          else
            echo "Creating release ${TAG}"
            if [ -f "${NOTES_FILE}" ]; then
              gh release create "${TAG}" \
                "${RELEASE_FILES[@]}" \
                --title "${TITLE}" \
                --notes-file "${NOTES_FILE}"
            else
              gh release create "${TAG}" \
                "${RELEASE_FILES[@]}" \
                --title "${TITLE}" \
                --generate-notes
            fi
          fi
